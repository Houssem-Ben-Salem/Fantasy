name: refresh-fpl-data

# GitHub-hosted runners CAN reach fantasy.premierleague.com, unlike most agent
# sandboxes. So this workflow exercises the LIVE path for the current season
# while history still comes from the mirror (see sources._is_current).
#
# That difference matters: live bootstrap-static carries more players than the
# mirror's periodic snapshot, so this job produces the fresher projections.

on:
  schedule:
    - cron: "0 6 * * *"      # daily
    - cron: "0 10 * * 5"     # again Friday, deadline day for most gameweeks
  workflow_dispatch:

permissions:
  contents: write            # required for the commit step below

concurrency:
  group: refresh-fpl-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Single source of truth for both the refresh and the export assertion that
    # checks the exported CSV actually covers the horizon it asked for.
    env:
      FPLBRAIN_SEASON: "2026-27"
      FPL_HORIZON: "8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Which sources are reachable decides which path the run takes, and the
      # path moves the headline numbers: live bootstrap-static carries ~590
      # current-season players against the mirror's ~567, so the crosswalk rate
      # moves ~0.78 -> ~0.806. That reads as a data regression if you don't know
      # the path changed. So annotate loudly — but do NOT fail. A mirror-path run
      # is a CORRECT run, and failing it would mean no fresh projections on a
      # deadline Friday because a runner IP got rate-limited. Losing working
      # output over a provenance question is the wrong trade.
      - name: Connectivity probe
        run: |
          python -m fplbrain.sources > probe.json
          cat probe.json
          python - <<'PY'
          import json, os, sys

          probe = json.load(open("probe.json"))
          fpl_ok = bool(probe.get("fpl_api", {}).get("ok"))
          mirror_ok = bool(probe.get("github_raw", {}).get("ok")
                           or probe.get("github_alt", {}).get("ok"))

          def summary(md: str) -> None:
              print(md)
              path = os.environ.get("GITHUB_STEP_SUMMARY")
              if path:
                  with open(path, "a") as fh:
                      fh.write(md + "\n")

          # The mirror is the floor. Without it there is no source for history
          # at all, and the live API cannot serve historical seasons. Fatal.
          if not mirror_ok:
              print("::error::no data source reachable: raw.githubusercontent.com is "
                    "unreachable, and the live FPL API cannot serve historical seasons "
                    "even when it is up. Refusing to build a database from nothing.",
                    file=sys.stderr)
              summary("### ❌ fplbrain refresh\nNo data source reachable — job failed.")
              sys.exit(1)

          if fpl_ok:
              summary("### fplbrain refresh\n"
                      "**Source path: LIVE** — current season from the FPL API, "
                      "history from the GitHub mirror. Numbers are directly "
                      "comparable to previous live runs.")
          else:
              status = probe.get("fpl_api", {}).get("status", "unreachable")
              print(f"::warning::FPL API unreachable (status {status}); the current "
                    "season came from the GitHub mirror snapshot instead. Expect a "
                    "LOWER current-season player count (~567 vs ~590) and a HIGHER "
                    "crosswalk match rate (~0.806 vs ~0.78) than a live run. This is "
                    "a PATH change, not a data regression, and the run is valid. "
                    "See exports/run_metadata.json for the resolved path.")
              summary(f"### ⚠️ fplbrain refresh\n"
                      f"**Source path: MIRROR** — FPL API returned `{status}`, so the "
                      f"current season came from the mirror snapshot.\n\n"
                      f"Player count and crosswalk rate will differ from a live run. "
                      f"This is expected, not a regression. The run is still valid.")
          PY

      - name: Refresh database and projections
        run: python scripts/refresh.py --db data/fpl.db --horizon "$FPL_HORIZON"

      - name: Run tests
        run: python -m pytest tests/ -q

      # Export projections as CSV. This is the artefact worth versioning:
      # ~900 KB of text that diffs sensibly, versus a 12 MB binary SQLite file
      # that would add roughly 3 GB to the repo over a season of daily runs and
      # that git cannot delta-compress. The DB rebuilds in 30s from `make ingest`.
      #
      # The assertions matter more than they look. v_latest_projections can
      # resolve to nothing if the newest `runs` row has no projections; without
      # a guard this step would write a header-only CSV, the commit step would
      # report "no projection changes", and the job would go green having
      # published nothing.
      - name: Export projections
        run: |
          mkdir -p exports
          python - <<'PY'
          import json, os, sqlite3, sys
          import pandas as pd

          def fail(msg: str) -> None:
              print(f"::error::export assertion failed: {msg}", file=sys.stderr)
              sys.exit(1)

          expected_gws = int(os.environ["FPL_HORIZON"])
          c = sqlite3.connect("data/fpl.db")
          df = pd.read_sql("SELECT * FROM v_latest_projections", c)

          if df.empty:
              fail("v_latest_projections returned 0 rows — the newest run in "
                   "`runs` probably has no projection rows, so the view resolved "
                   "to nothing. Refusing to publish a header-only CSV.")

          n_gws = df["gw"].nunique()
          if n_gws != expected_gws:
              fail(f"expected {expected_gws} distinct gameweeks (FPL_HORIZON), "
                   f"got {n_gws}: {sorted(int(g) for g in df['gw'].unique())}")

          if df["exp_points"].isna().all():
              fail("exp_points is entirely null")
          if (df["exp_points"].fillna(0) == 0).all():
              fail("exp_points is entirely zero — the model produced no signal")

          df.to_csv("exports/projections_latest.csv", index=False)
          pd.read_sql(
              "SELECT run_id, created_at, horizon_start, horizon_end, provenance "
              "FROM runs ORDER BY created_at DESC LIMIT 20", c
          ).to_csv("exports/runs_recent.csv", index=False)

          # Provenance travels WITH the artefact. Without this, a shifted
          # crosswalk rate in the CSV requires correlating against a CI log that
          # may have aged out, and the obvious reading — "the data changed" — is
          # the wrong one when the real cause is "the path changed". Everything
          # here is read back from what ingest already persisted; nothing is
          # recomputed and nothing is re-fetched.
          from datetime import datetime, timezone

          season = os.environ.get("FPLBRAIN_SEASON", "2026-27")
          ing = pd.read_sql(
              "SELECT run_id, created_at, provenance FROM runs "
              "WHERE notes='ingest' ORDER BY created_at DESC LIMIT 1", c)
          prov = json.loads(ing.iloc[0]["provenance"]) if len(ing) else {}
          proj = pd.read_sql(
              "SELECT r.run_id, r.created_at, r.horizon_start, r.horizon_end "
              "FROM projections p JOIN runs r ON r.run_id = p.run_id "
              "ORDER BY r.created_at DESC LIMIT 1", c).iloc[0]

          source_paths = {k: v for k, v in prov.items()
                          if isinstance(v, str) and not k.startswith("crosswalk")}
          resolved = "live" if prov.get("players_current") == "live" else "mirror"

          meta = {
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "season": season,
              "resolved_path": resolved,
              "run_id": str(proj["run_id"]),
              "run_created_at": str(proj["created_at"]),
              "horizon": {"start": int(proj["horizon_start"]),
                          "end": int(proj["horizon_end"]),
                          "gameweeks": expected_gws},
              "projection_rows": int(len(df)),
              "current_season_players": prov.get("current_season_players"),
              "crosswalk_match_rate": prov.get("crosswalks", {}),
              "source_paths": source_paths,
              "connectivity": prov.get("connectivity", {}),
              "note": ("resolved_path explains the headline numbers. A 'mirror' run "
                       "has a lower current_season_players and a higher "
                       "crosswalk_match_rate than a 'live' run because the mirror's "
                       "players_raw.csv is a periodic snapshot and a strict subset of "
                       "the live player list. Both are correct; live is fresher."),
          }
          with open("exports/run_metadata.json", "w") as fh:
              json.dump(meta, fh, indent=2, sort_keys=True)
              fh.write("\n")

          print(f"exported {len(df)} rows across {n_gws} gameweeks "
                f"via the {resolved} path")
          PY

      # The database goes to artifacts, not git. This runs on EVERY execution,
      # including the daily ones that do not commit — 14-day retention covers
      # any midweek investigation without versioning midweek state.
      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpl-db-${{ github.run_number }}
          path: data/fpl.db
          retention-days: 14

      # INTENTIONAL GATE. A non-Friday run producing NO COMMIT is EXPECTED, not
      # a bug — if you are reading a green run that says "skipping commit by
      # design", that is this working. Do not "fix" it by restoring a daily
      # commit: ~900 KB versioned every day across 266 runs a season is real
      # volume for state nobody acts on. The Friday deadline run is the one that
      # informs a decision, so that is the history worth keeping. Daily runs
      # still refresh, test, and upload the DB artifact (14-day retention),
      # which covers any midweek investigation.
      #
      # Gated on the UTC weekday rather than on
      #     if: github.event.schedule == '0 10 * * 5'
      # deliberately. That form couples the gate to a cron string defined
      # elsewhere in this file, so renumbering the schedule would silently stop
      # the commit — a green job publishing nothing, which is the failure mode
      # this pipeline has already produced twice. The weekday check is local to
      # the thing it guards and cannot drift out of sync.
      - name: Commit projections
        run: |
          if [ "$(date -u +%u)" != "5" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "$(date -u +%F) is not Friday (UTC) and this is not a manual dispatch"
            echo "skipping commit by design — see the comment above this step"
            exit 0
          fi
          git config user.name "fplbrain-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/
          if git diff --staged --quiet; then
            echo "no projection changes"
          else
            git commit -m "refresh projections: $(date -u +%F)"
            git push
          fi
